    <!-- A masthead rather than a plate. Wrapped in .textbox this heading was
         visually identical to every show card beneath it - same veil, same
         noise, same measure - so it read as the first item in the list rather
         than as the title of the list. On open ground it can only be a title. -->
    <header class="page-masthead">
      <!-- The hero's arced wordmark at page-title scale: same lime, same dark
           halo, same starburst under the curve. role="img" + aria-label rather
           than a hidden span beside an aria-hidden svg, so the name is in the
           document once. -->
      <h1 class="page-title page-arc">
        <svg class="page-arc-svg" viewBox="0 0 480 132" role="img"
             aria-label="Radio Archive" focusable="false">
          <defs>
            <!-- the hero arc's proportions, scaled: a 450 chord on a 420 radius
                 rises about 60, the same shallow curve at three quarters size -->
            <path id="page-arc-path" d="M 15,118 A 420,420 0 0 1 465,118" fill="none"></path>
          </defs>
          <text class="page-arc-text">
            <textPath href="#page-arc-path" startOffset="50%" text-anchor="middle">Radio Archive</textPath>
          </text>
        </svg>
        <span class="bog-star page-arc-star" aria-hidden="true"></span>
      </h1>
      <p class="page-masthead__lead">Bog Factor shows from days of yore</p>
    </header>

    <div id="shows-container"></div>
