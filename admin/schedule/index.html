<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Schedule - Bog Factor Admin</title>
<link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/noto-serif-gurmukhi" rel="stylesheet">
<style>
  :root {
    --brown: rgb(135, 89, 33);
    --red: rgb(218, 72, 72);
    --green: rgb(107, 142, 35);
    --text: rgb(54, 50, 41);
    --panel: #f7e0c1be;
  }
  body {
    background: url('../../assets/vibes-graphic.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Noto Serif Gurmukhi', sans-serif;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1rem 6rem;
    box-sizing: border-box;
  }
  .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 2rem; }
  .panel { background: var(--panel); padding: 1.5rem; box-sizing: border-box; }
  h1, h2 { font-family: 'Luminari', fantasy; color: var(--brown); margin: 0 0 1rem; }
  .back-link { color: var(--brown); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .back-link:hover { color: var(--red); }
  h1 { font-size: 2rem; }
  h2 { font-size: 1.3rem; }
  label { display: block; margin-top: 0.9rem; font-weight: 600; }
  label .hint { font-weight: 400; color: rgb(130, 71, 81); }
  input, textarea, select {
    display: block;
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.25rem;
    border: 1px solid rgba(135, 89, 33, 0.4);
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.7);
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brown); outline-offset: -1px; }
  textarea { resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  @media (max-width: 600px) { .row, .row-3 { grid-template-columns: 1fr; } }
  .inline-check { display: flex; align-items: center; gap: 6px; margin-top: 0.9rem; font-weight: 600; }
  .inline-check input { width: auto; margin: 0; }
  button {
    margin-top: 1rem;
    padding: 10px 18px;
    background: var(--brown);
    color: wheat;
    border: none;
    font-family: 'Luminari', fantasy;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: var(--red); }
  button.secondary { background: transparent; color: var(--brown); border: 1px solid var(--brown); }
  button.danger { background: var(--red); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 0.5rem; font-weight: 600; min-height: 1.4em; }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }
  .actions-bar { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .actions-bar button { margin: 0; }
  .image-preview {
    display: block; max-width: 200px; max-height: 150px;
    margin-top: 0.5rem; border: 1px solid rgba(135, 89, 33, 0.4);
  }
  .sched-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(135, 89, 33, 0.2);
  }
  .sched-row .meta { font-size: 0.85rem; opacity: 0.75; }
  .sched-row .inactive { color: var(--red); font-style: italic; }
  .sched-row button { margin: 0; padding: 6px 12px; font-size: 0.85rem; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <p><a href="/admin/index.html" class="back-link">← Admin tools</a></p>
    <h1>Manage Schedule</h1>
    <p>The site reads this to decide when Bog Factor is live, what's next, and which
       town-crier cards to show. Changes go live within ~60 seconds.</p>
    <div id="auth-status" class="status"></div>
  </div>

  <!-- ============ Recurring schedule ============ -->
  <div class="panel">
    <h2>Recurring schedule</h2>
    <div id="recurring-list">Loading…</div>
  </div>

  <div class="panel">
    <h2 id="recurring-form-title">New recurring rule</h2>
    <form id="recurring-form">
      <input type="hidden" id="rec-editing-id">

      <label>Title
        <input type="text" id="rec-title" required value="Bog Factor">
      </label>
      <label>Description <span class="hint">(optional)</span>
        <textarea id="rec-description" rows="2"></textarea>
      </label>

      <div class="row-3">
        <label>Frequency
          <select id="rec-freq">
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
          </select>
        </label>
        <label id="rec-week-wrap">Week of month
          <select id="rec-week">
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
          </select>
        </label>
        <label>Day
          <select id="rec-weekday">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5" selected>Friday</option>
            <option value="6">Saturday</option>
          </select>
        </label>
      </div>

      <div class="row-3">
        <label>Start time <span class="hint">(local)</span>
          <input type="time" id="rec-time" value="13:00" required>
        </label>
        <label>Duration (min)
          <input type="number" id="rec-duration" min="1" step="1" value="60" required>
        </label>
        <label>Timezone
          <input type="text" id="rec-timezone" value="Europe/London">
        </label>
      </div>

      <div class="row">
        <label>Effective from <span class="hint">(optional)</span>
          <input type="date" id="rec-from">
        </label>
        <label>Effective until <span class="hint">(optional)</span>
          <input type="date" id="rec-until">
        </label>
      </div>

      <label>Skip dates <span class="hint">(one YYYY-MM-DD per line, for months off or moved)</span>
        <textarea id="rec-skips" rows="3" placeholder="2026-08-07"></textarea>
      </label>

      <label class="inline-check">
        <input type="checkbox" id="rec-active" checked> Active
      </label>

      <div class="actions-bar">
        <button type="submit" id="rec-save-btn">Save rule</button>
        <button type="button" id="rec-reset-btn" class="secondary">Reset form</button>
      </div>
      <div id="rec-status" class="status"></div>
    </form>
  </div>

  <!-- ============ Ad-hoc shows ============ -->
  <div class="panel">
    <h2>Ad-hoc shows &amp; specials</h2>
    <div id="oneoff-list">Loading…</div>
  </div>

  <div class="panel">
    <h2 id="oneoff-form-title">New ad-hoc show</h2>
    <form id="oneoff-form">
      <input type="hidden" id="one-editing-id">

      <label>Title
        <input type="text" id="one-title" required>
      </label>
      <label>Description <span class="hint">(optional)</span>
        <textarea id="one-description" rows="2"></textarea>
      </label>

      <div class="row-3">
        <label>Starts at <span class="hint">(local datetime)</span>
          <input type="datetime-local" id="one-startsAt" required>
        </label>
        <label>Duration (min)
          <input type="number" id="one-duration" min="1" step="1" value="60" required>
        </label>
        <label>Timezone
          <input type="text" id="one-timezone" value="Europe/London">
        </label>
      </div>

      <label>Announcement link <span class="hint">(optional)</span>
        <input type="url" id="one-link" placeholder="https://…">
      </label>

      <label>Card image <span class="hint">(optional, defaults to the town crier)</span>
        <input type="file" id="one-image-file" accept="image/*">
        <input type="hidden" id="one-imageKey">
        <img id="one-image-preview" class="image-preview" style="display:none" alt="">
      </label>

      <label class="inline-check">
        <input type="checkbox" id="one-active" checked> Active
      </label>

      <div class="actions-bar">
        <button type="submit" id="one-save-btn">Save show</button>
        <button type="button" id="one-reset-btn" class="secondary">Reset form</button>
      </div>
      <div id="one-status" class="status"></div>
    </form>
  </div>

</div>

<script src="../../scripts/admin-schedule.js"></script>
</body>
</html>
