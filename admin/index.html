<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Bog Factor</title>
<link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/noto-serif-gurmukhi" rel="stylesheet">
<style>
  :root {
    --brown: rgb(135, 89, 33);
    --red: rgb(218, 72, 72);
    --text: rgb(54, 50, 41);
    --panel: #f7e0c1be;
  }
  body {
    background: url('../assets/vibes-graphic.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Noto Serif Gurmukhi', sans-serif;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1rem 6rem;
    box-sizing: border-box;
  }
  .wrap { max-width: 700px; margin: 0 auto; display: grid; gap: 1.5rem; }
  .panel { background: var(--panel); padding: 1.5rem; box-sizing: border-box; }
  h1 { font-family: 'Luminari', fantasy; color: var(--brown); margin: 0 0 0.5rem; font-size: 2rem; }
  .panel > p { margin: 0; }

  .tool-grid { display: grid; gap: 1rem; }
  .tool-card {
    display: block;
    background: var(--panel);
    padding: 1.5rem;
    text-decoration: none;
    color: var(--text);
    border: 1px solid rgba(135, 89, 33, 0.35);
    transition: border-color 0.2s, transform 0.1s;
  }
  .tool-card:hover { border-color: var(--brown); transform: translateY(-2px); }
  .tool-card h2 {
    font-family: 'Luminari', fantasy;
    color: var(--brown);
    margin: 0 0 0.3rem;
    font-size: 1.4rem;
  }
  .tool-card:hover h2 { color: var(--red); }
  .tool-card p { margin: 0; font-size: 0.95rem; opacity: 0.85; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Bog Factor Admin</h1>
    <p>Tools for running the show. Pick one below.</p>
  </div>

  <!-- Add new tools here as more get built. -->
  <div class="tool-grid">
    <a class="tool-card" href="/admin/add-show/index.html">
      <h2>Add New Show</h2>
      <p>Create a new archive show with its tracklist.</p>
    </a>
    <a class="tool-card" href="/admin/shows/index.html">
      <h2>Manage Previous Shows</h2>
      <p>Edit or remove shows already in the archive.</p>
    </a>
    <a class="tool-card" href="/admin/tracks/index.html">
      <h2>Check for Repeats</h2>
      <p>Check a proposed tracklist against everything you've played before.</p>
    </a>
  </div>

</div>
</body>
</html>
