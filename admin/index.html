<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Bog Factor</title>
<link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/noto-serif-gurmukhi" rel="stylesheet">
<style>
  :root {
    --brown: rgb(135, 89, 33);
    --red: rgb(218, 72, 72);
    --green: rgb(107, 142, 35);
    --text: rgb(54, 50, 41);
    --panel: #f7e0c1be;
    --panel-solid: #f7e0c1;
  }
  body {
    background: url('../assets/vibes-graphic.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Noto Serif Gurmukhi', sans-serif;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1rem 6rem;
    box-sizing: border-box;
  }
  .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 2rem; }
  .panel {
    background: var(--panel);
    padding: 1.5rem;
    box-sizing: border-box;
  }
  h1, h2 { font-family: 'Luminari', fantasy; color: var(--brown); margin: 0 0 1rem; }
  h1 { font-size: 2rem; }
  h2 { font-size: 1.3rem; }
  label { display: block; margin-top: 0.9rem; font-weight: 600; }
  label .hint { font-weight: 400; color: rgb(130, 71, 81); }
  input, textarea, select {
    display: block;
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.25rem;
    border: 1px solid rgba(135, 89, 33, 0.4);
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.7);
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brown); outline-offset: -1px; }
  textarea { resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  button {
    margin-top: 1rem;
    padding: 10px 18px;
    background: var(--brown);
    color: wheat;
    border: none;
    font-family: 'Luminari', fantasy;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: var(--red); }
  button.secondary { background: transparent; color: var(--brown); border: 1px solid var(--brown); }
  button.danger { background: var(--red); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .show-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(135, 89, 33, 0.2);
  }
  .show-row .meta { font-size: 0.85rem; opacity: 0.75; }
  .show-row button { margin: 0; padding: 6px 12px; font-size: 0.85rem; font-family: inherit; }
  .status { margin-top: 0.5rem; font-weight: 600; min-height: 1.4em; }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }
  .image-preview {
    display: block;
    max-width: 240px;
    max-height: 180px;
    margin-top: 0.5rem;
    border: 1px solid rgba(135, 89, 33, 0.4);
  }
  .actions-bar { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .actions-bar button { margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Bog Factor Admin</h1>
    <p>Add, edit, and remove archive shows. Changes go live within ~60 seconds.</p>
    <div id="auth-status" class="status"></div>
  </div>

  <div class="panel">
    <h2 id="form-title">New Show</h2>
    <form id="show-form">
      <input type="hidden" id="editing-id">

      <div class="row">
        <label>ID <span class="hint">(slug, e.g. feb2026)</span>
          <input type="text" id="id" required>
        </label>
        <label>Aired at <span class="hint">(local datetime)</span>
          <input type="datetime-local" id="airedAt" required>
        </label>
      </div>

      <label>Title
        <input type="text" id="title" required>
      </label>

      <label>Description <span class="hint">(HTML &lt;a&gt; tags allowed)</span>
        <textarea id="description" rows="4" required></textarea>
      </label>

      <div class="row">
        <label>Mixcloud path <span class="hint">(e.g. /ehfm/bog-factor-060226/)</span>
          <input type="text" id="mixcloudPath" required>
        </label>
        <label>SoundCloud URL <span class="hint">(optional)</span>
          <input type="url" id="soundcloudUrl">
        </label>
      </div>

      <div class="row">
        <label>Duration (minutes) <span class="hint">(optional)</span>
          <input type="number" id="durationMin" min="0" step="1">
        </label>
        <label>Producer <span class="hint">(optional)</span>
          <input type="text" id="producer">
        </label>
      </div>

      <label>Image <span class="hint">(optional)</span>
        <input type="file" id="image-file" accept="image/*">
        <input type="hidden" id="imageKey">
        <img id="image-preview" class="image-preview" style="display:none" alt="">
      </label>

      <label>Import tracklist from Rekordbox <span class="hint">(optional)</span>
        <input type="file" id="rekordbox-file" accept=".txt">
      </label>

      <label>Tracklist <span class="hint">(one per line, "Title - Artist")</span>
        <textarea id="tracklist" rows="10" placeholder="Track Title - Artist"></textarea>
      </label>

      <label>
        <input type="checkbox" id="isPublished" checked style="width:auto;display:inline-block;margin-right:6px">
        Published
      </label>

      <div class="actions-bar">
        <button type="submit" id="save-btn">Save</button>
        <button type="button" id="reset-btn" class="secondary">Reset form</button>
      </div>
      <div id="form-status" class="status"></div>
    </form>
  </div>

  <div class="panel">
    <h2>Existing shows</h2>
    <div id="shows-list">Loading…</div>
  </div>

</div>

<script src="../tools/rekordbox-to-tracklist.js"></script>
<script>
(function () {
  const API = '/api/admin';

  const $ = (id) => document.getElementById(id);
  const form = $('show-form');
  const statusEl = $('form-status');
  const listEl = $('shows-list');
  const authEl = $('auth-status');
  const imgPreview = $('image-preview');

  let editingExisting = false;

  function setStatus(el, msg, kind = '') {
    el.textContent = msg || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function toLocalInput(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fromLocalInput(v) {
    if (!v) return null;
    const d = new Date(v);
    return isNaN(d) ? null : d.toISOString();
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      credentials: 'include',
      headers: opts.body && !(opts.body instanceof FormData)
        ? { 'Content-Type': 'application/json' }
        : undefined,
      ...opts,
    });
    if (res.status === 401 || res.status === 403) {
      setStatus(authEl, 'Not authenticated. Refresh to log in via Cloudflare Access.', 'error');
      throw new Error('Unauthorized');
    }
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) throw new Error(data?.error || res.statusText);
    return data;
  }

  async function loadShows() {
    listEl.textContent = 'Loading…';
    try {
      const shows = await api('/shows');
      if (!shows.length) {
        listEl.innerHTML = '<p>No shows yet.</p>';
        return;
      }
      listEl.innerHTML = '';
      shows.forEach((s) => {
        const row = document.createElement('div');
        row.className = 'show-row';
        const info = document.createElement('div');
        const aired = new Date(s.airedAt);
        info.innerHTML = `<strong>${escapeHtml(s.title)}</strong>` +
          `<div class="meta">${s.id} · ${isNaN(aired) ? s.airedAt : aired.toLocaleString()}` +
          (s.isPublished === false ? ' · <em>unpublished</em>' : '') + '</div>';
        const edit = document.createElement('button');
        edit.textContent = 'Edit';
        edit.className = 'secondary';
        edit.onclick = () => loadIntoForm(s);
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.className = 'danger';
        del.onclick = () => deleteShow(s.id, s.title);
        row.append(info, edit, del);
        listEl.appendChild(row);
      });
    } catch (err) {
      listEl.innerHTML = '<p>Failed to load: ' + escapeHtml(err.message) + '</p>';
    }
  }

  function loadIntoForm(s) {
    editingExisting = true;
    $('form-title').textContent = 'Edit Show';
    $('editing-id').value = s.id;
    $('id').value = s.id;
    $('id').disabled = true;
    $('title').value = s.title || '';
    $('description').value = s.description || '';
    $('mixcloudPath').value = s.mixcloudPath || '';
    $('soundcloudUrl').value = s.soundcloudUrl || '';
    $('airedAt').value = toLocalInput(s.airedAt);
    $('durationMin').value = s.durationMin || '';
    $('producer').value = s.producer || '';
    $('isPublished').checked = s.isPublished !== false;
    $('tracklist').value = (s.tracklist || []).join('\n');
    $('imageKey').value = s.image ? extractKey(s.image) : '';
    if (s.image) {
      imgPreview.src = s.image;
      imgPreview.style.display = 'block';
    } else {
      imgPreview.removeAttribute('src');
      imgPreview.style.display = 'none';
    }
    setStatus(statusEl, '');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function extractKey(url) {
    const m = url.match(/\/api\/images\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function resetForm() {
    editingExisting = false;
    form.reset();
    $('form-title').textContent = 'New Show';
    $('editing-id').value = '';
    $('id').disabled = false;
    $('imageKey').value = '';
    imgPreview.removeAttribute('src');
    imgPreview.style.display = 'none';
    setStatus(statusEl, '');
  }

  async function deleteShow(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    try {
      await api('/shows/' + encodeURIComponent(id), { method: 'DELETE' });
      await loadShows();
      if ($('editing-id').value === id) resetForm();
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
  }

  async function uploadImage(file) {
    const fd = new FormData();
    fd.append('file', file);
    const res = await api('/images', { method: 'POST', body: fd });
    return res.key;
  }

  $('image-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus(statusEl, 'Uploading image…');
    try {
      const key = await uploadImage(file);
      $('imageKey').value = key;
      imgPreview.src = '/api/images/' + encodeURIComponent(key);
      imgPreview.style.display = 'block';
      setStatus(statusEl, 'Image uploaded.', 'success');
    } catch (err) {
      setStatus(statusEl, 'Image upload failed: ' + err.message, 'error');
    }
  });

  rekordboxToTracklist.attach($('rekordbox-file'), (tracks) => {
    $('tracklist').value = tracks.join('\n');
  });

  $('reset-btn').addEventListener('click', resetForm);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus(statusEl, '');
    const airedIso = fromLocalInput($('airedAt').value);
    if (!airedIso) { setStatus(statusEl, 'Invalid aired-at datetime', 'error'); return; }

    const body = {
      id: $('id').value.trim(),
      title: $('title').value.trim(),
      description: $('description').value.trim(),
      mixcloudPath: $('mixcloudPath').value.trim(),
      soundcloudUrl: $('soundcloudUrl').value.trim() || null,
      airedAt: airedIso,
      durationMin: $('durationMin').value ? Number($('durationMin').value) : null,
      producer: $('producer').value.trim() || null,
      imageKey: $('imageKey').value || null,
      isPublished: $('isPublished').checked,
      tracklist: $('tracklist').value.split('\n').map((l) => l.trim()).filter(Boolean),
    };

    try {
      $('save-btn').disabled = true;
      if (editingExisting) {
        await api('/shows/' + encodeURIComponent($('editing-id').value), {
          method: 'PUT',
          body: JSON.stringify(body),
        });
        setStatus(statusEl, 'Show updated.', 'success');
      } else {
        await api('/shows', { method: 'POST', body: JSON.stringify(body) });
        setStatus(statusEl, 'Show created.', 'success');
        resetForm();
      }
      await loadShows();
    } catch (err) {
      setStatus(statusEl, err.message, 'error');
    } finally {
      $('save-btn').disabled = false;
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  loadShows();
})();
</script>
</body>
</html>
