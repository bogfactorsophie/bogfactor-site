<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Countdown - Bog Factor</title>
    <link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/noto-serif-gurmukhi" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <!-- Configure test overrides BEFORE loading main scripts -->
    <script>
      // Test state - modified by test controls below
      var testNextShowDate = null;

      window.BogFactorTestConfig = {
        isLandingPage: true,
        getNextShowDate: function() {
          if (!testNextShowDate) return null; // fall through to real logic
          var now = new Date();
          var showEnd = new Date(testNextShowDate.getTime() + 60 * 60 * 1000);
          // If test show has ended, return a date far in the future so countdown resets
          if (now >= showEnd) {
            var nextMonth = new Date(testNextShowDate);
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            nextMonth.setDate(1);
            // Find first Friday of next month
            while (nextMonth.getDay() !== 5) {
              nextMonth.setDate(nextMonth.getDate() + 1);
            }
            nextMonth.setHours(13, 0, 0, 0);
            return nextMonth;
          }
          return testNextShowDate;
        },
        isLiveNow: function() {
          if (!testNextShowDate) return null; // fall through to real logic
          var now = new Date();
          var showEnd = new Date(testNextShowDate.getTime() + 60 * 60 * 1000);
          return now >= testNextShowDate && now < showEnd;
        }
      };
    </script>
    <script src="../scripts/live-stream.js"></script>
    <script src="../scripts/toolbar-live-widget.js"></script>
  </head>

  <body>
    <style>
      body {
        background: url('../assets/vibes-graphic.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      .test-controls {
        background: #f7e0c1;
        padding: 20px;
        margin: 20px auto;
        max-width: 600px;
        border-radius: 8px;
        filter: url(#wavy-smooth);
      }
      .test-controls h2 {
        margin-top: 0;
        font-family: 'Luminari', fantasy;
        color: rgb(135, 89, 33);
      }
      .test-controls label {
        display: block;
        margin: 15px 0 5px 0;
        font-family: 'Noto Serif Gurmukhi', sans-serif;
        font-weight: 600;
      }
      .test-controls input, .test-controls select {
        width: 100%;
        padding: 8px;
        font-size: 16px;
        border: 2px solid rgb(135, 89, 33);
        border-radius: 4px;
        box-sizing: border-box;
      }
      .test-controls button {
        background-color: rgb(135, 89, 33);
        color: wheat;
        border: none;
        padding: 12px 20px;
        font-family: 'MedievalSharp', cursive;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
        width: 100%;
      }
      .test-controls button:hover {
        background-color: rgb(218, 72, 72);
      }
      .test-info {
        margin-top: 15px;
        padding: 10px;
        background: rgba(135, 89, 33, 0.1);
        border-radius: 4px;
        font-family: 'Noto Serif Gurmukhi', sans-serif;
        font-size: 14px;
      }
    </style>

    <!-- SVG filter for wavy borders -->
    <svg style="position: absolute; width: 0; height: 0;">
      <defs>
        <filter id="wavy-smooth">
          <feTurbulence x="0" y="0" baseFrequency="0.01" numOctaves="2" seed="1" />
          <feDisplacementMap in="SourceGraphic" scale="3" />
        </filter>
      </defs>
    </svg>

    <div class="toolbar">
      <a href="../index.html">Home</a>
      <a href="../radio/index.html">Radio</a>
      <a href="../about/index.html">About</a>
    </div>

    <div class="test-controls">
      <h2>Countdown Test Controls</h2>
      <p>Set a test "next show" date and time to see how the countdown displays.</p>

      <label for="test-preset">Quick Test Presets:</label>
      <select id="test-preset">
        <option value="">-- Choose a preset --</option>
        <option value="1min">1 minute from now (watch it go live!)</option>
        <option value="59min-ago">1 minute until show ends (watch it end!)</option>
        <option value="30min">30 minutes from now</option>
        <option value="2hours">2 hours from now</option>
        <option value="12hours">12 hours from now</option>
        <option value="23hours">23 hours from now</option>
        <option value="2days">2 days from now</option>
      </select>

      <label for="test-datetime">Or set custom date/time:</label>
      <input type="datetime-local" id="test-datetime">

      <button id="apply-test">Apply Test Date</button>
      <button id="reset-test">Reset to Real Date</button>

      <div class="test-info">
        <strong>Current display:</strong> <span id="current-countdown">Loading...</span><br>
        <strong>Time format:</strong> <span id="time-format">-</span><br>
        <strong>Update interval:</strong> <span id="update-interval">-</span><br>
        <strong>Status:</strong> <span id="live-status">-</span><br>
        <br>
        <em>Tip: Try "1 minute from now" to watch the countdown reach zero and automatically switch to "LIVE NOW!" mode.</em>
      </div>
    </div>

    <script>
      // Test controls - only UI logic, all stream/widget/countdown handled by main scripts
      (function() {
        'use strict';

        function updateTestInfo() {
          var api = window.BogFactorLiveStream;
          if (!api) return;

          var nextShow = api.getNextShowDate();
          var now = new Date();
          var diff = nextShow - now;
          var days = Math.floor(diff / (1000 * 60 * 60 * 24));
          var interval = api.getCurrentInterval();

          // Compute the countdown text the same way as the main script
          var countdownEl = document.querySelector('.countdown');
          var countdownText = countdownEl ? countdownEl.textContent : '-';

          document.getElementById('current-countdown').textContent = countdownText;
          document.getElementById('time-format').textContent = days === 0 ? 'Textual with seconds (< 1 day)' : 'Days, Hours (> 1 day)';
          document.getElementById('update-interval').textContent = interval === 1000 ? 'Every second' : 'Every minute';
          document.getElementById('live-status').textContent = api.isLiveNow() ? 'LIVE NOW!' : 'Off-air (countdown mode)';
        }

        // Update test info display every second
        setInterval(updateTestInfo, 1000);

        // Preset selector
        document.getElementById('test-preset').addEventListener('change', function(e) {
          if (!e.target.value) return;

          var now = new Date();
          var testDate = new Date(now);

          switch(e.target.value) {
            case '1min':
              testDate.setMinutes(testDate.getMinutes() + 1);
              break;
            case '59min-ago':
              testDate.setMinutes(testDate.getMinutes() - 59);
              break;
            case '30min':
              testDate.setMinutes(testDate.getMinutes() + 30);
              break;
            case '2hours':
              testDate.setHours(testDate.getHours() + 2);
              break;
            case '12hours':
              testDate.setHours(testDate.getHours() + 12);
              break;
            case '23hours':
              testDate.setHours(testDate.getHours() + 23);
              break;
            case '2days':
              testDate.setDate(testDate.getDate() + 2);
              break;
          }

          var dateString = testDate.toISOString().slice(0, 16);
          document.getElementById('test-datetime').value = dateString;
        });

        document.getElementById('apply-test').addEventListener('click', function() {
          var dateInput = document.getElementById('test-datetime').value;
          if (dateInput) {
            testNextShowDate = new Date(dateInput);
            window.BogFactorLiveStream.forceUpdate();
            updateTestInfo();
          } else {
            alert('Please select a date/time first.');
          }
        });

        document.getElementById('reset-test').addEventListener('click', function() {
          testNextShowDate = null;
          document.getElementById('test-datetime').value = '';
          document.getElementById('test-preset').value = '';
          window.BogFactorLiveStream.forceUpdate();
          updateTestInfo();
        });

        // Initial info update
        updateTestInfo();
      })();
    </script>
  </body>
</html>
