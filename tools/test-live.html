<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bog Factor - LIVE TEST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/morris-roman" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gurmukhi:wght@400;600&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="../scripts/draggable-suns.js"></script>
    <!-- Configure test overrides BEFORE loading main scripts -->
    <script>
      window.BogFactorTestConfig = {
        isLiveNow: () => true,
        isLandingPage: true,
        // The crier card below the hero builds itself from getUpcoming(), so
        // forcing isLiveNow() alone would leave it counting down to the next
        // real show while the hero says we are on air. Hand it an occurrence
        // that started half an hour ago and runs for another half hour.
        getUpcoming: () => [{
          title: 'Bog Factor',
          description: 'Test show, on air for the next half hour.',
          startsAt: new Date(Date.now() - 30 * 60 * 1000).toISOString(),
          endsAt: new Date(Date.now() + 30 * 60 * 1000).toISOString(),
          image: '../assets/town-crier.png'
        }]
      };
    </script>
    <script src="../scripts/schedule.js"></script>
    <script src="../scripts/live-stream.js"></script>
    <script src="../scripts/toolbar-live-widget.js"></script>
    <script src="../scripts/toolbar-menu.js"></script>
    <script src="../scripts/upcoming-shows.js"></script>
  </head>

  <!-- Mirrors index.html: the same body class, the same static hero markup and
       the same upcoming-shows section, so what you see here is what the landing
       page does when we are on air.

       What to check:
         - the hero's status line appears (it is empty and hidden off air) and
           reads "On air right now on EHFM" with a pulsing dot
         - the hero shows NO play or chat button, in either state. Both used to
           be here and both were duplicates: the dock plays the stream off air
           and on, and the toolbar grows its own LIVE NOW and Chat pair for the
           hour. The status line is the hero's whole announcement.
         - the crier card is hidden for the hour, so the hero is not also
           saying when the next show is while this one is playing
         - the toolbar grows a LIVE NOW button and a Chat button, and the bar
           does NOT change height when they appear
         - the EHFM dock, bottom left, reads "Bog Factor, live" rather than
           "EHFM, live"
         - with Reduce Motion on in the OS, the dots stop pulsing but stay
           fully visible -->
  <body class="landing-page">

    <div class="toolbar">
      <span class="toolbar-logo" aria-hidden="true"><span>Bog</span> <span>Factor</span></span>
      <nav class="toolbar-nav">
        <a href="../radio/index.html">Radio</a>
        <a href="../vault/index.html">Vault</a>
        <a href="../lore/index.html">Lore</a>
      </nav>
    </div>

    <main class="hero" id="hero" data-live="false">
      <!-- role="img" + aria-label, rather than a visually-hidden span beside an
           aria-hidden svg: that arrangement put the name in the document twice,
           so a crawler read "Bog Factor BOG FACTOR". This way the glyphs are the
           only copy of the text and assistive tech gets one clean label. -->
      <div class="hero-inner">
      <h1 class="wordmark">
        <svg class="wordmark-svg" viewBox="0 0 640 215" role="img"
             aria-label="Bog Factor" focusable="false">
          <defs>
            <!-- A wide, shallow arc (radius 560 over a 600 chord, so it rises
                 about 87 units). The original painted wordmark curves gently;
                 a tighter radius rotates the outer letters so steeply that the
                 word reads as lopsided. -->
            <path id="bog-arc" d="M 20,190 A 560,560 0 0 1 620,190" fill="none"></path>
          </defs>
          <text class="wordmark-text">
            <textPath href="#bog-arc" startOffset="50%" text-anchor="middle">Bog Factor</textPath>
          </text>
        </svg>
        <!-- the shared starburst, sized and placed as a share of the arc so it
             tracks the wordmark at any width -->
        <span class="bog-star wordmark-star" aria-hidden="true"></span>
      </h1>

      <p class="hero-lede">Sophie and Emily go wading for psychedelic folk, pagan boogie and sleaze. Monthly on EHFM, Edinburgh.</p>

      <!-- Empty and hidden off air. The crier card below answers when the next
           show is; this line only speaks when the show is actually on. -->
      <p class="hero-status" id="hero-status" role="status"></p>

      <!-- The crier's notice, in the hero where a duplicate "Listen to EHFM"
           button used to be. The card below is the authored fallback — what a
           reader with no JavaScript sees — and upcoming-shows.js replaces it
           once the schedule resolves. It hides itself while live. -->
      <div class="hero-crier" id="upcoming-section">
        <div class="upcoming-shows" id="upcoming-shows">
          <p class="crier-heading">Hear ye! Coming up...</p>
          <div class="crier-card">
            <img class="crier-card__crier" src="/assets/town-crier.png" alt="" aria-hidden="true">
            <div class="crier-card__body">
              <p class="crier-card__when">First Friday of the month</p>
              <h3 class="crier-card__title">Bog Factor</h3>
              <p class="crier-card__desc">Live on EHFM, 1pm to 2pm UK.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty in both states, exactly as index.html authors it. Kept only so
           a test page can author a control here to drive the stream directly. -->
      <div class="hero-actions" id="hero-actions"></div>
      </div>

    </main>

    <footer class="footer">
      <a href="https://www.instagram.com/bog_factor/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="mailto:hello@bogfactor.co.uk">Email</a>
    </footer>
  </body>

</html>
