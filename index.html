  <body class="landing-page">

    <div class="toolbar">
      <span class="toolbar-logo" aria-hidden="true"><span>Bog</span> <span>Factor</span></span>
      <nav class="toolbar-nav">
        <a href="/radio/index.html">Radio</a>
        <a href="/vault/index.html">Vault</a>
        <a href="/lore/index.html">Lore</a>
      </nav>
    </div>

    <!-- The hero is static markup on purpose: it renders without JavaScript,
         gives a crawler something to read, and reserves its own height so
         live-stream.js filling in the status line cannot shift the page.
         scripts/live-stream.js swaps it into its on-air state.

         The arced wordmark used to be painted into the background photograph.
         It is now type, which means it is the page's real h1, it stays crisp at
         any size, and the photograph underneath is free of text. -->
    <main class="hero" id="hero" data-live="false">
      <!-- role="img" + aria-label, rather than a visually-hidden span beside an
           aria-hidden svg: that arrangement put the name in the document twice,
           so a crawler read "Bog Factor BOG FACTOR". This way the glyphs are the
           only copy of the text and assistive tech gets one clean label. -->
      <div class="hero-inner">
      <h1 class="wordmark">
        <svg class="wordmark-svg" viewBox="0 0 640 215" role="img"
             aria-label="Bog Factor" focusable="false">
          <defs>
            <!-- A wide, shallow arc (radius 560 over a 600 chord, so it rises
                 about 87 units). The original painted wordmark curves gently;
                 a tighter radius rotates the outer letters so steeply that the
                 word reads as lopsided. -->
            <path id="bog-arc" d="M 20,190 A 560,560 0 0 1 620,190" fill="none"></path>
          </defs>
          <text class="wordmark-text">
            <textPath href="#bog-arc" startOffset="50%" text-anchor="middle">Bog Factor</textPath>
          </text>
        </svg>
        <!-- the shared starburst, sized and placed as a share of the arc so it
             tracks the wordmark at any width -->
        <span class="bog-star wordmark-star" aria-hidden="true"></span>
      </h1>

      <p class="hero-lede">Sophie and Emily go wading for psychedelic folk, pagan boogie and sleaze. Monthly on EHFM, Edinburgh.</p>

      <!-- Empty and hidden off air. The crier card below answers "when is the
           next one"; this line only speaks when the show is actually on. -->
      <p class="hero-status" id="hero-status" role="status"></p>

      <!-- The proclamation, filled by scripts/upcoming-shows.js. It stands
           where a "Listen to EHFM" button used to: that button drove the same
           stream as the dock in the corner, so the hero was spending its one
           call to action on a control the page already had. The crier is the
           thing the hero could not say otherwise.

           The card below is the authored fallback — what a reader with no
           JavaScript sees — and upcoming-shows.js replaces it once the schedule
           resolves. CSS hides the whole block while Bog Factor is on air,
           because then the actions row underneath becomes the loud thing. -->
      <div class="hero-crier" id="upcoming-section">
        <div class="upcoming-shows" id="upcoming-shows">
          <p class="crier-heading">Hear ye! Coming up...</p>
          <div class="crier-card">
            <img class="crier-card__crier" src="/assets/town-crier.png" alt="" aria-hidden="true">
            <div class="crier-card__body">
              <p class="crier-card__when">First Friday of the month</p>
              <h3 class="crier-card__title">Bog Factor</h3>
              <p class="crier-card__desc">Live on EHFM, 1pm to 2pm UK.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty in both states, and CSS collapses it so it leaves no gap. The
           hero used to grow a filled "Listen live" and a "Join the chat" link
           for the hour we are on, but the toolbar already grows its own LIVE NOW
           and Chat pair then, and the dock plays the stream in both states — so
           those were a third and fourth copy of the same two controls. The row
           stays so the test pages can author one here. -->
      <div class="hero-actions" id="hero-actions"></div>
      </div>

      <a class="hero-scroll" href="#recent-section">
        <span>Dig deeper</span>
        <span class="hero-scroll__chevron" aria-hidden="true"></span>
      </a>
    </main>

    <!-- The three most recent shows, filled by scripts/recent-shows.js from
         /api/shows. Hidden until they load, so a failed fetch leaves no empty
         frame behind. -->
    <section class="textbox recent-section" id="recent-section" hidden>
      <h2 class="recent-heading">Latest from the bog</h2>
      <!-- The way through to the whole archive. It was a sentence under the
           cards ("All the shows and their tracklists"), which read as a fourth
           thing to weigh up after three shows; as a mark in the corner of the
           plate it is the same door without the paragraph. The shovel is the
           same gesture the hero's "Dig deeper" cue makes, so the two ways
           further into the site are saying the same thing. The label carries
           the meaning for anyone not seeing the icon. -->
      <a class="recent-all" href="/radio/index.html"
         aria-label="All the shows and their tracklists"
         title="All the shows and their tracklists"><img class="recent-all__icon"
         src="/assets/shovel-icon.png" alt="" aria-hidden="true" width="512" height="512"></a>
      <div class="recent-grid" id="recent-shows"></div>
    </section>
