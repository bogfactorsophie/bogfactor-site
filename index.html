<!doctype html>
<html>    
  <head>
    <title>Bog Factor</title>
    <link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/noto-serif-gurmukhi" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">


  </head>

  <body>

    <script>
      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      const textboxData = [
        { link: '/radio/index.html', label: 'Go to Radio' },
        { link: '/about/index.html', label: 'Go to About' },
        { link: '/blog/index.html', label: 'Go to Blog' }
      ];

      textboxData.forEach((data, idx) => {
        const box = document.createElement('div');
        const width = getRandomInt(180, 350);
        const height = getRandomInt(80, 180);
        const left = getRandomInt(20, window.innerWidth - width - 20);
        const top = getRandomInt(80, window.innerHeight - height - 80);
        box.className = 'draggable-textbox';
        box.style.position = 'absolute';
        box.style.left = left + 'px';
        box.style.top = top + 'px';
        box.style.width = width + 'px';
        box.style.height = height + 'px';
        box.style.padding = '20px';
        box.style.background = '#fffbe8';
        box.style.border = '2px solid #bfa76f';
        box.style.borderRadius = '10px';
        box.style.boxShadow = '2px 2px 10px #bfa76f99';
        box.style.cursor = 'move';
        box.style.zIndex = 1000 + idx;
        box.innerHTML = `<strong>Drag me!</strong><br><a href="${data.link}">${data.label}</a>`;
        document.body.appendChild(box);

        let isDragging = false, offsetX = 0, offsetY = 0;
        box.addEventListener('mousedown', function(e) {
          isDragging = true;
          offsetX = e.clientX - box.offsetLeft;
          offsetY = e.clientY - box.offsetTop;
          box.style.transition = 'none';
        });
        document.addEventListener('mousemove', function(e) {
          if (isDragging) {
            box.style.left = (e.clientX - offsetX) + 'px';
            box.style.top = (e.clientY - offsetY) + 'px';
          }
        });
        document.addEventListener('mouseup', function() {
          isDragging = false;
          box.style.transition = '';
        });
      });
    </script>

    <style>
      body {
        background: url('assets/vibes-graphic.jpg') no-repeat center center fixed;
        background-size: cover;
      }
    </style>

    <footer class="footer">
      <a href="https://www.instagram.com/bog_factor/" target="_blank">Instagram</a>
      <a href="https://www.mixcloud.com/ehfm/" target="_blank">Mixcloud</a>
    </footer>
  </body>

</html>
